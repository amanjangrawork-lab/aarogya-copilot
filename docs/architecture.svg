<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" font-family="Segoe UI, Arial">
<rect width="1000" height="600" fill="#eef3f9"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#0a2540">Aarogya Copilot — Trust-gated pipeline + ABDM-ready schema (fast static)</text>
<text x="30" y="62" font-size="12" fill="#5a6d85">Ingest → OCR → Extract (confidence+span) → Review gate → Trends/Timeline → 4-lang summary → FHIR R4 / ABHA mock · 7/7 self-check</text>
<g font-size="12">
<rect x="30" y="90" width="150" height="70" rx="10" fill="#fff" stroke="#0b5ed7"/><text x="40" y="112" font-weight="bold">Ingest</text><text x="40" y="130">PDF/JPG/PNG</text><text x="40" y="146">paste + 6 demos</text>
<rect x="200" y="90" width="170" height="70" rx="10" fill="#fff" stroke="#0b5ed7"/><text x="210" y="112" font-weight="bold">OCR pdf.js +</text><text x="210" y="128" font-weight="bold">Tesseract.js</text><text x="210" y="146">eng+hin/tel/tam</text>
<rect x="390" y="90" width="180" height="70" rx="10" fill="#fff" stroke="#0b5ed7"/><text x="400" y="112" font-weight="bold">Extractor + trust</text><text x="400" y="130">meds · labs+LOINC</text><text x="400" y="146">conf + span + flag</text>
<rect x="590" y="90" width="170" height="70" rx="10" fill="#fff8e6" stroke="#9a5b00"/><text x="600" y="112" font-weight="bold">Review gate</text><text x="600" y="130">Confirm/Correct</text><text x="600" y="146">conflict flagged</text>
<rect x="780" y="90" width="190" height="70" rx="10" fill="#e3f0ff" stroke="#0a2540"/><text x="790" y="112" font-weight="bold">Timeline + Trends</text><text x="790" y="130">active meds + spark</text><text x="790" y="146">wellness + events</text>
<rect x="30" y="180" width="370" height="70" rx="10" fill="#fff" stroke="#0b5ed7"/><text x="40" y="202" font-weight="bold">Summarizer EN/HI/TE/TA + audio</text><text x="40" y="220">abnormal meanings + ask-doctor + Gemini opt</text>
<rect x="420" y="180" width="550" height="70" rx="10" fill="#0a2540"/><text x="440" y="206" font-weight="bold" fill="#fff">FHIR R4 Bundle (NRKES) + mock ABHA OTP 123456</text><text x="440" y="226" fill="#c8e1ff">Patient(ABHA) · Observation(LOINC) · MedReq · Condition(ICD-10+SNOMED) · DocRef</text>
<rect x="30" y="270" width="940" height="90" rx="10" fill="#fff" stroke="#dbe5f1"/><text x="50" y="296" font-weight="bold">Judge 60s (faceless): Lab → Review Confirm → Summary + Listen → Hindi → Timeline trends → FHIR Export → self-check 7/7</text><text x="50" y="318">Zero backend, data in browser, fast static, print-ready. No login/key. Samples + 46-check matrix in sample-data/.</text><text x="50" y="340">Safety: educational-only, no dose advice, 108/112 banner, negation guard, confirmed vs auto distinguished.</text>
<rect x="30" y="380" width="940" height="180" rx="10" fill="#fff" stroke="#dbe5f1"/><text x="50" y="406" font-weight="bold">Scoring map</text><text x="50" y="428">AI 35%: OCR + extraction + Review provenance + abnormal meanings (lab 10 labs, rx 4 meds exact)</text><text x="50" y="450">Arch 25%: pipeline + trust gate + FHIR/LOINC/SNOMED + diagram + export/import round-trip</text><text x="50" y="472">UX 20%: 1-click demos, 5 tabs, judge banner, trends, 4-lang + audio, a11y (skip/focus/reduced-motion)</text><text x="50" y="494">Impact 10%: disclaimers, hedged, emergency; Demo 10%: slides + 3-min script + optional video</text><text x="50" y="526" fill="#0b5ed7">Bonus: 4-lang UI + OCR hin/tel/tam · ABDM-ready schema, honest mock (gateway-ready, no over-claim)</text>
</g>
<g stroke="#0b5ed7" stroke-width="2"><line x1="180" y1="125" x2="200" y2="125"/><line x1="370" y1="125" x2="390" y2="125"/><line x1="570" y1="125" x2="590" y2="125"/><line x1="760" y1="125" x2="780" y2="125"/><line x1="500" y1="160" x2="500" y2="180"/></g></svg>
